# Pangolin Test Configuration
# For local Docker-based testing of DNS Authority and Auth Proxy

gerbil:
    start_port: 51820
    base_endpoint: "172.28.0.5"
    subnet_group: "100.89.137.0/20"
    block_size: 24
    site_block_size: 30

app:
    dashboard_url: "http://localhost:3001"
    log_level: "debug"
    telemetry:
        anonymous_usage: false

domains:
    test-domain:
        base_domain: "test.dev"

server:
    secret: "test-secret-for-local-development-do-not-use-in-production-32chars!"
    external_port: 3001
    internal_port: 3002
    next_port: 3000
    cors:
        origins: ["http://localhost:3000", "http://pangolin:3000", "http://pangolin:3001"]
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        allowed_headers: ["X-CSRF-Token", "Content-Type", "Authorization"]
        credentials: true

postgres:
    connection_string: "postgres://pangolin:pangolin_test_password@postgres:5432/pangolin"

flags:
    require_email_verification: false
    disable_signup_without_invite: false
    disable_user_create_org: false
    allow_raw_resources: true

traefik:
    certificates_path: "/var/certificates"
    monitor_interval: 5000

users:
    server_admin:
        email: "admin@test.dev"
        password: "TestAdmin123!"

settings:
    allow_registration: true
    org_require_approval: false

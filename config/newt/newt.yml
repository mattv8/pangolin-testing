# Newt Test Configuration
# Configuration for local testing of DNS Authority and Auth Proxy

# Connection settings
pangolin_endpoint: "http://pangolin:3002"
newt_id: "test-newt-001"
newt_secret: "test-secret-for-local-development-only"

# Logging
log_level: "debug"

# DNS Authority Settings
dns_authority:
  enabled: true
  listen_addr: "0.0.0.0:53"
  default_ttl: 60
  # Health check settings for routing decisions
  health_check_interval: 10
  health_check_timeout: 5

# Auth Proxy Settings
auth_proxy:
  enabled: true
  listen_http: "0.0.0.0:8080"
  listen_https: "0.0.0.0:8443"
  cookie_name: "p_session"

# Network settings
network:
  interface: "wg0"

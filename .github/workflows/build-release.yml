name: Build & Release Newt + OLM
# Triggered manually or by tag push. Cross-compiles Go binaries, creates
# GitHub releases, and optionally builds Docker images to Harbor.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. dns-authority-v0.1.0)'
        required: true
        default: 'dns-authority-dev'
      push_docker:
        description: 'Push Docker images to Harbor'
        required: false
        default: 'false'
        type: boolean

  push:
    tags:
      - 'dns-authority-*'

env:
  HARBOR_URL: hub.docker.visnovsky.us
  HARBOR_PROJECT: library

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Cross-compile Go binaries for Newt and OLM
  # ──────────────────────────────────────────────────────────────────
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [newt, olm]
    steps:
      - name: Checkout ${{ matrix.component }}
        uses: actions/checkout@v4
        with:
          repository: mattv8/${{ matrix.component }}
          path: ${{ matrix.component }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.component }}/go.sum

      - name: Compile all platforms
        working-directory: ${{ matrix.component }}
        run: |
          mkdir -p bin

          targets=(
            "linux:amd64::"
            "linux:arm64::"
            "linux:arm:7:arm32"
            "linux:arm:6:arm32v6"
            "linux:riscv64::"
            "darwin:amd64::"
            "darwin:arm64::"
            "windows:amd64::_windows_amd64.exe"
          )

          for target in "${targets[@]}"; do
            IFS=':' read -r goos goarch goarm suffix <<< "$target"
            if [ -z "$suffix" ]; then
              suffix="${goos}_${goarch}"
            fi
            output="bin/${{ matrix.component }}_${suffix}"
            echo "Building ${output}..."
            env="CGO_ENABLED=0 GOOS=${goos} GOARCH=${goarch}"
            [ -n "$goarm" ] && env="${env} GOARM=${goarm}"
            eval "${env}" go build -ldflags="-s -w" -o "${output}" .
          done

          ls -lh bin/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-binaries
          path: ${{ matrix.component }}/bin/

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub releases with the compiled binaries
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [newt, olm]
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ matrix.component }}
        uses: actions/checkout@v4
        with:
          repository: mattv8/${{ matrix.component }}
          path: ${{ matrix.component }}

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.component }}-binaries
          path: binaries/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        working-directory: ${{ matrix.component }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          gh release delete "${TAG}" --yes 2>/dev/null || true

          gh release create "${TAG}" \
            --title "${{ matrix.component }} ${TAG}" \
            --notes "DNS Authority feature build. Auto-generated by CI.

          Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/mattv8/pangolin-testing/main/scripts/get-${{ matrix.component }}.sh | bash
          \`\`\`" \
            --prerelease \
            ../binaries/*

  # ──────────────────────────────────────────────────────────────────
  # (Optional) Build and push Docker images to Harbor
  # ──────────────────────────────────────────────────────────────────
  docker:
    if: github.event.inputs.push_docker == 'true'
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [pangolin, newt, olm]
    steps:
      - name: Checkout ${{ matrix.component }}
        uses: actions/checkout@v4
        with:
          repository: mattv8/${{ matrix.component }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}:${{ steps.tag.outputs.tag }}
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}:latest
          build-args: |
            BUILD=oss
            DATABASE=sqlite
            VERSION=${{ steps.tag.outputs.tag }}

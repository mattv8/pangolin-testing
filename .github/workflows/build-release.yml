name: Build & Release Newt + OLM
# Triggered manually or by tag push. Cross-compiles Go binaries, creates
# GitHub releases, and optionally builds Docker images to Harbor.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. dns-authority-v0.1.0)'
        required: true
        default: 'dns-authority-dev'
      push_docker:
        description: 'Push Docker images to Harbor'
        required: false
        default: 'false'
        type: boolean

  push:
    tags:
      - 'dns-authority-*'

env:
  HARBOR_URL: hub.docker.visnovsky.us
  HARBOR_PROJECT: library

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Cross-compile Go binaries for Newt and OLM
  # ──────────────────────────────────────────────────────────────────
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [newt, olm]
    steps:
      - name: Checkout ${{ matrix.component }}
        uses: actions/checkout@v4
        with:
          repository: mattv8/${{ matrix.component }}
          path: ${{ matrix.component }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.component }}/go.sum

      - name: Compile all platforms
        working-directory: ${{ matrix.component }}
        run: |
          mkdir -p bin

          build_bin() {
            local goos=$1 goarch=$2 goarm=$3 suffix=$4
            local output="bin/${{ matrix.component }}_${suffix}"
            echo "Building ${output}..."
            export CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}"
            [ -n "$goarm" ] && export GOARM="${goarm}"
            go build -ldflags="-s -w" -o "${output}" .
            unset GOARM
          }

          build_bin linux   amd64  ""  linux_amd64
          build_bin linux   arm64  ""  linux_arm64
          build_bin linux   arm    7   linux_arm32
          build_bin linux   arm    6   linux_arm32v6
          build_bin linux   riscv64 "" linux_riscv64
          build_bin darwin  amd64  ""  darwin_amd64
          build_bin darwin  arm64  ""  darwin_arm64
          build_bin windows amd64  ""  windows_amd64.exe

          ls -lh bin/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-binaries
          path: ${{ matrix.component }}/bin/

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub release on pangolin-testing with all binaries
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pangolin-testing
        uses: actions/checkout@v4

      - name: Download newt binaries
        uses: actions/download-artifact@v4
        with:
          name: newt-binaries
          path: binaries/

      - name: Download olm binaries
        uses: actions/download-artifact@v4
        with:
          name: olm-binaries
          path: binaries/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          gh release delete "${TAG}" --yes 2>/dev/null || true

          gh release create "${TAG}" \
            --title "DNS Authority ${TAG}" \
            --notes "DNS Authority feature build — Newt & OLM binaries.
          Auto-generated by CI on $(date -u +%Y-%m-%d).

          ## Install

          \`\`\`bash
          # Newt
          curl -fsSL https://raw.githubusercontent.com/mattv8/pangolin-testing/main/scripts/get-newt.sh | bash

          # OLM
          curl -fsSL https://raw.githubusercontent.com/mattv8/pangolin-testing/main/scripts/get-olm.sh | bash
          \`\`\`" \
            --prerelease \
            binaries/*

  # ──────────────────────────────────────────────────────────────────
  # (Optional) Build and push Docker images to Harbor
  # Structured like fosrl/pangolin cicd.yml: separate arch builds + manifest
  # ──────────────────────────────────────────────────────────────────
  docker-amd64:
    if: github.event.inputs.push_docker == 'true'
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [pangolin, newt, olm]
    steps:
      - name: Checkout ${{ matrix.component }}
        uses: actions/checkout@v4
        with:
          repository: mattv8/${{ matrix.component }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-amd64
          tags: |
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}:${{ steps.tag.outputs.tag }}-amd64
          build-args: |
            BUILD=oss
            DATABASE=sqlite
            VERSION=${{ steps.tag.outputs.tag }}

  docker-arm64:
    if: github.event.inputs.push_docker == 'true'
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pangolin excluded: QEMU ARM64 builds timeout fetching Google Fonts
        component: [newt, olm]
    steps:
      - name: Checkout ${{ matrix.component }}
        uses: actions/checkout@v4
        with:
          repository: mattv8/${{ matrix.component }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (ARM64)
        uses: docker/build-push-action@v6
        env:
          # Prevent Next.js OOM retries under QEMU emulation
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-arm64
          tags: |
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}:${{ steps.tag.outputs.tag }}-arm64
          build-args: |
            BUILD=oss
            DATABASE=sqlite
            VERSION=${{ steps.tag.outputs.tag }}

  docker-manifest:
    if: github.event.inputs.push_docker == 'true'
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [pangolin, newt, olm]
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}"

          if [ "${{ matrix.component }}" = "pangolin" ]; then
            # pangolin: amd64-only (ARM64 skipped due to QEMU Google Fonts timeout)
            echo "Tagging ${IMAGE}:${TAG}-amd64 as ${IMAGE}:${TAG} and latest..."
            docker buildx imagetools create \
              --tag "${IMAGE}:${TAG}" \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${TAG}-amd64"
          else
            # newt/olm: multi-arch manifest from buildx OCI indexes
            echo "Creating multi-arch manifest for ${IMAGE}:${TAG}..."
            docker buildx imagetools create \
              --tag "${IMAGE}:${TAG}" \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          fi

          echo "Manifest pushed for ${{ matrix.component }}"

  docker-sign:
    if: github.event.inputs.push_docker == 'true'
    needs: [docker-manifest]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [pangolin, newt, olm]
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get manifest digest
        id: digest
        run: |
          IMAGE="${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}"
          TAG="${{ steps.tag.outputs.tag }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Manifest digest: ${DIGEST}"

      - name: Sign images with cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE="${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ matrix.component }}"
          DIGEST="${{ steps.digest.outputs.digest }}"

          echo "Signing ${IMAGE}@${DIGEST}..."
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            -a "repo=${{ matrix.component }}" \
            -a "tag=${{ steps.tag.outputs.tag }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "run=${{ github.run_id }}" \
            --yes \
            "${IMAGE}@${DIGEST}"

          echo "Verifying signature..."
          cosign verify --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}" || echo "⚠️ Verification failed (cosign public key may be needed for verify)"

-- dnsdist Configuration for DCA Site
-- Intelligent DNS Routing with Health Checking

-- ============================================================================
-- SITE CONFIGURATION
-- ============================================================================
local SITE_NAME = "DCA"
local SITE_IP = "10.10.0.100"

-- Upstream DNS servers
newServer({address="8.8.8.8:53", name="google-dns-1"})
newServer({address="1.1.1.1:53", name="cloudflare-dns-1"})

-- ============================================================================
-- SERVICE DEFINITIONS
-- ============================================================================
local SERVICES = {
    {
        name = "Harbor Docker Registry",
        domains = {
            "%.docker%.visnovsky%.us%.$",
            "%.docker%.example%.com%.$"
        },
        local_ip = "10.10.0.104",
        remote_ip = "192.168.50.104",
        -- External public IPs for clients outside VPN
        external_ip_dca = "68.142.136.236",
        external_ip_dcb = "136.38.238.75",
        health_check = {
            enabled = true,
            url_path = "/api/v2.0/health",
            interval = 30,
            timeout = 10
        },
        local_networks = {"10.10.0.0/16", "100.90.128.0/24", "192.168.50.0/24"}
    }
}

-- ============================================================================
-- STATIC HOST MAPPINGS
-- Routes specific hosts to Pangolin reverse proxy for web UIs
-- ============================================================================
local STATIC_HOSTS = {
    ["docker.visnovsky.us."] = {internal = "10.10.0.100", external = "68.142.136.236"},
    ["hub.docker.visnovsky.us."] = {internal = "10.10.0.100", external = "68.142.136.236"},
}

-- Networks considered "internal" (VPN/LAN)
local INTERNAL_NETWORKS = {"10.10.0.0/16", "100.90.128.0/24", "192.168.50.0/24"}

local function isInternalClient(client_ip)
    for _, network in ipairs(INTERNAL_NETWORKS) do
        local nmg = newNMG()
        nmg:addMask(network)
        if nmg:match(newCA(client_ip)) then
            return true
        end
    end
    return false
end

-- ============================================================================
-- NETWORK DEFINITIONS
-- ============================================================================
local function isLocalClient(client_ip, service)
    for _, network in ipairs(service.local_networks) do
        local nmg = newNMG()
        nmg:addMask(network)
        if nmg:match(newCA(client_ip)) then
            return true
        end
    end
    return false
end

-- ============================================================================
-- HEALTH CHECK SYSTEM
-- ============================================================================
local health_status = {}

for i, service in ipairs(SERVICES) do
    health_status[service.name] = {
        local_healthy = true,
        remote_healthy = false
    }
end

function checkHealth(service_name, ip, url_path, timeout)
    local cmd = string.format("curl -s -o /dev/null -w '%%{http_code}' --max-time %d http://%s%s",
                             timeout, ip, url_path)
    local handle = io.popen(cmd)
    local result = handle:read("*a")
    handle:close()

    local http_code = tonumber(result)
    local is_healthy = (http_code == 200)

    if is_healthy then
        infolog(string.format("Health Check OK: %s (%s)", service_name, ip))
    else
        infolog(string.format("Health Check FAILED: %s (%s) - HTTP %06d", service_name, ip, http_code or 0))
    end

    return is_healthy
end

function runHealthChecks()
    for _, service in ipairs(SERVICES) do
        if service.health_check.enabled then
            local local_healthy = checkHealth(
                service.name .. " (Local)",
                service.local_ip,
                service.health_check.url_path,
                service.health_check.timeout
            )

            local remote_healthy = checkHealth(
                service.name .. " (Remote)",
                service.remote_ip,
                service.health_check.url_path,
                service.health_check.timeout
            )

            health_status[service.name].local_healthy = local_healthy
            health_status[service.name].remote_healthy = remote_healthy

            infolog(string.format("Service '%s' Health - Local: %s, Remote: %s",
                                service.name,
                                tostring(local_healthy),
                                tostring(remote_healthy)))
        end
    end
end

-- Run initial health check
runHealthChecks()

-- ============================================================================
-- DNS ROUTING LOGIC
-- ============================================================================
function routeQuery(dq)
    local qname = dq.qname:toString()
    local client_ip = dq.remoteaddr:toString()
    local qtype = dq.qtype

    -- Check for static host mappings first (exact match)
    if STATIC_HOSTS[qname] then
        if qtype == DNSQType.A then
            local host_config = STATIC_HOSTS[qname]
            local is_internal = isInternalClient(client_ip)
            local static_ip = is_internal and host_config.internal or host_config.external
            infolog(string.format("Static Host: %s -> %s (client: %s, internal: %s)", qname, static_ip, client_ip, tostring(is_internal)))
            return DNSAction.Spoof, static_ip
        elseif qtype == DNSQType.AAAA then
            -- Return empty response for AAAA (no IPv6 available) to avoid NXDOMAIN delay
            infolog(string.format("Static Host AAAA: %s -> NODATA (client: %s)", qname, client_ip))
            return DNSAction.Nxdomain
        end
    end

    -- Check each service for domain pattern match
    for _, service in ipairs(SERVICES) do
        local domain_match = false

        for _, pattern in ipairs(service.domains) do
            if string.match(qname, pattern) then
                domain_match = true
                break
            end
        end

        if domain_match then
            -- Handle A queries with intelligent routing
            if qtype == DNSQType.A then
                local is_local = isLocalClient(client_ip, service)
                local status = health_status[service.name]
                local target_ip
                local reason

                if is_local then
                    -- Internal client: use internal IPs
                    if status.local_healthy then
                        target_ip = service.local_ip
                        reason = string.format("Local client -> Local %s (healthy)", service.name)
                    elseif status.remote_healthy then
                        target_ip = service.remote_ip
                        reason = string.format("Local client -> Remote %s (local unhealthy)", service.name)
                    else
                        target_ip = service.local_ip
                        reason = string.format("Local client -> Local %s (both unhealthy, using local)", service.name)
                    end
                else
                    -- External client: use external public IPs with health-based failover
                    if status.local_healthy then
                        target_ip = service.external_ip_dca
                        reason = string.format("External client -> DCA external %s (healthy)", service.name)
                    elseif status.remote_healthy then
                        target_ip = service.external_ip_dcb
                        reason = string.format("External client -> DCB external %s (DCA unhealthy)", service.name)
                    else
                        target_ip = service.external_ip_dca
                        reason = string.format("External client -> DCA external %s (both unhealthy, using DCA)", service.name)
                    end
                end

                infolog(string.format("Routing: %s -> %s (%s)", client_ip, target_ip, reason))
                return DNSAction.Spoof, target_ip
            elseif qtype == DNSQType.AAAA then
                -- Return NXDOMAIN for AAAA to avoid upstream lookup delay
                infolog(string.format("Service AAAA: %s -> NODATA (client: %s)", qname, client_ip))
                return DNSAction.Nxdomain
            end

            -- For other query types (NS, SOA, etc.), let upstream handle it
            return DNSAction.None
        end
    end

    -- Not a managed domain, pass to upstream
    return DNSAction.None
end

-- Add the routing action
addAction(AllRule(), LuaAction(routeQuery))

-- ============================================================================
-- PERIODIC HEALTH CHECKS
-- ============================================================================
-- Schedule health checks every 30 seconds using a query-based trigger
local last_health_check = os.time()
local health_check_interval = 30

function periodicHealthCheck(dq)
    local now = os.time()
    if now - last_health_check >= health_check_interval then
        runHealthChecks()
        last_health_check = now
    end
    return DNSAction.None
end

addAction(AllRule(), LuaAction(periodicHealthCheck))

-- ============================================================================
-- ACCESS CONTROL AND LISTENERS
-- ============================================================================
setACL({"0.0.0.0/0"})
addLocal(SITE_IP .. ":53")

-- Web interface and API
setKey("changeme-api-key-here")
setWebserverConfig({password="changeme", apiKey="changeme-api-key-here"})
webserver("0.0.0.0:8083")
controlSocket("0.0.0.0:5199")

-- ============================================================================
-- CACHE AND PERFORMANCE TUNING
-- ============================================================================
-- Add packet cache to reduce latency on repeated queries
pc = newPacketCache(10000, {
    maxTTL = 300,
    minTTL = 5,
    temporaryFailureTTL = 10,
    staleTTL = 60,
    dontAge = false
})
getPool(""):setCache(pc)

-- Set low TTL for spoofed responses (60 seconds allows quick failover)
setECSOverride(false)
setECSSourcePrefixV4(24)
setECSSourcePrefixV6(56)

-- ============================================================================
-- STARTUP MESSAGE
-- ============================================================================
infolog(string.format("dnsdist %s site started - Intelligent routing active for %d service(s)",
                     SITE_NAME, #SERVICES))
infolog(string.format("Listening on %s:53", SITE_IP))
infolog("ACL allowing queries from: 0.0.0.0/0")
infolog("Console ACL allowing connections from: 127.0.0.0/8, ::1/128")
